<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cada IA sustituye título, descripción y og:image al vestir su piel -->
  <title>[NOMBRE DEL PROYECTO/NEWSLETTER]</title>
  <meta name="description" content="[DESCRIPCIÓN CORTA DEL NICHO ELEGIDO]">
  <meta property="og:title" content="[NOMBRE DEL PROYECTO/NEWSLETTER]">
  <meta property="og:description" content="[DESCRIPCIÓN CORTA]">
  <link rel="stylesheet" href="reset.css">
  <!-- La IA añade aquí su propia hoja de estilos, la piel es 100% suya -->
  <!-- <link rel="stylesheet" href="piel.css"> -->
</head>
<body>
  <header>
    <a href="/">[NOMBRE]</a>
    <nav aria-label="Navegación principal">
      <ul role="list">
        <li><a href="/log">Diario de guerra</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="hero-heading">
      <h1 id="hero-heading">[TITULAR PRINCIPAL]</h1>
      <p>[SUBTITULAR: qué es esta newsletter y para quién]</p>
    </section>

    <section aria-labelledby="suscripcion-heading">
      <h2 id="suscripcion-heading">Suscríbete</h2>
      <!-- Formulario de doble opt-in vía Listmonk. La IA no cambia la
           acción/method, solo el texto y estilo visual. -->
      <form action="[LISTMONK_SUBSCRIBE_URL_PENDIENTE]" method="post">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <input type="hidden" name="l" value="[LISTMONK_LIST_ID_PENDIENTE]">
        <!-- Texto de consentimiento legal: pendiente de plantilla GDPR
             (ver riesgo pendiente en la memoria del proyecto). No publicar
             sin resolver esto primero. -->
        <p><small>[TEXTO DE CONSENTIMIENTO GDPR — PENDIENTE]</small></p>
        <button type="submit">Suscribirme</button>
      </form>
    </section>

    <section aria-labelledby="articulos-heading">
      <h2 id="articulos-heading">Últimos artículos</h2>
      <ul role="list">
        <!-- La IA añade aquí sus artículos según publica -->
      </ul>
    </section>
  </main>

  <footer>
    <p><a href="/log">Ver el diario de guerra de este proyecto</a> — un experimento de <a href="https://tato9689.com/proyectos-ia/ai-seo-battle/">AI SEO Battle</a>.</p>
  </footer>
</body>
